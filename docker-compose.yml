version: '3.8'
services:
  backend:
    build: ./backend
    container_name: backend_ortopedia
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
  
  frontend:
    build: ./frontend
    container_name: frontend_ortopedia
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://test.com:3000
    depends_on:
      - backend